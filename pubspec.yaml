name: pure_dart_app
description: "A 100% Dart-based AI Dubbing System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  ffmpeg_kit_flutter_full_gpl: ^6.0.3
  provider: ^6.1.2
  file_picker: ^8.1.3
  video_player: ^2.9.1
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  http_parser: ^4.0.2
  flutter_dotenv: ^5.1.0
  chewie: ^1.8.5
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
